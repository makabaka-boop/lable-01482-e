version: '3.8'

# ========================================
# CodeForge IDE - Docker Compose
# ========================================

services:
  # 前端服务 - CodeForge IDE
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      platforms:
        - "linux/amd64"
        - "linux/arm64"
    container_name: codeforge-frontend
    image: codeforge-ide:latest
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - codeforge-network
    labels:
      - "app=codeforge-ide"
      - "service=frontend"

networks:
  codeforge-network:
    driver: bridge
    name: codeforge-network
